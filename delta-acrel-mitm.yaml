uart:
  - id: moduart_client     # cross rx/tx lines from ESP to ttl-rs485
    tx_pin: GPIO16   # connected to tx pin on ttl-rs485, labelled rx pin on ESP
    rx_pin: GPIO17   # meter(server), ESP meter client on this bus
    baud_rate: 9600
    stop_bits: 1
    data_bits: 8
    parity: NONE

  - id: moduart_inverter  # also mute_client for battery. cross rx/tx from ESP to ttl-rs485
    tx_pin: GPIO18   # connected to tx pin on ttl-rs485, labelled rx pin on ESP
    rx_pin: GPIO19   # ESP fake meter(server), inverter(client), battery on this bus
    baud_rate: 9600
    stop_bits: 1
    data_bits: 8
    parity: NONE
  
modbus:
  - uart_id: moduart_client  # meter -- MITM meter client
    id: modbus_meter_client
    role: client
  - uart_id: moduart_inverter  # battery -- inverter -- MITM fake meter server
    id: modbus_inverter
    role: server
#  - uart_id: moduart_inverter  # battery mute client - store batt response data 
#    id: modbus_battery         
#    role: mute_client
  # - uart_id: moduart_inverter  # battery mute server - observe inverter requests to battery
  #   id: modbus_batt_server
  #   role: server

modbus_controller:
  - id: batt_mute_client  # observe inverter requests, parse battery response
    address: 0x0F  # address of the LG battery
    modbus_id: modbus_inverter # on the batt/inv bus
    setup_priority: -10
  - id: meter_client
    address: 0x02  # address of the meter - Acrel AGF-AE-D
    modbus_id: modbus_meter_client
    command_throttle: 100ms
    setup_priority: -10
    update_interval: .7s
  - id: modbus_controller_server
    address: 0x02  # fake meter server needs id#2 as the Delta Ex-TL-US inverter expects
    modbus_id: modbus_inverter
    command_throttle: 100ms
    setup_priority: -10
    server_registers:
      - address: 40001   # Fixed integer value Sunspec length, inverter checking for meter type?
        value_type: S_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return 105;  
      - address: 40002   # est current from adj power and voltage, both A & V are .1 scaling 
        value_type: S_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return static_cast<int16_t>(static_cast<float>(id(adjusted_meter_power).state) / id(meter_LL_Voltage).state);   
      - address: 40003   # estimate current from power
        value_type: S_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return static_cast<int16_t>(static_cast<float>(id(adjusted_power_ph_a).state) / id(meter_PhA_N_Voltage).state);   
      - address: 40004   # estimate current from power
        value_type: S_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return static_cast<int16_t>(static_cast<float>(id(adjusted_power_ph_b).state) / id(meter_PhB_N_Voltage).state);   
      - address: 40008
        value_type: U_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return id(meter_PhA_N_Voltage).state;
      - address: 40009
        value_type: U_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return id(meter_PhB_N_Voltage).state;
      - address: 40010
        value_type: U_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return id(meter_PhC_N_Voltage).state;
      - address: 40011
        value_type: U_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return id(meter_LL_Voltage).state;
      - address: 40016
        value_type: U_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return id(meter_freq).state;

      - address: 40018  # adjusted with mqtt offset & gain, delay if meter_disable = true prevents inverter closed loop control
        value_type: S_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { 
            delay(2000); 
            return 0; }
          return id(adjusted_meter_power).state;
      - address: 40019  
        value_type: S_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          int16_t power_a_value = (id(meter_power_ph_a).state) * id(delta_ctrl_gain).state + id(processed_delta_gt_meter_adjust_half).state;
          return power_a_value;
      - address: 40020
        value_type: S_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          int16_t power_b_value = (id(meter_power_ph_b).state) * id(delta_ctrl_gain).state + id(processed_delta_gt_meter_adjust_half).state;
          return power_b_value;
      - address: 40021
        value_type: S_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return id(meter_power_ph_c).state;
      - address: 40022
        value_type: S_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return id(meter_real_power_scale_factor).state;

      - address: 40033
        value_type: S_WORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return id(meter_power_factor).state;
      - address: 40038
        value_type: S_DWORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return id(meter_TotWh_Exp).state;
      - address: 40040
        value_type: S_DWORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return id(meter_TotWhPhA_Exp).state;
      - address: 40042
        value_type: S_DWORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return id(meter_TotWhPhB_Exp).state;
      - address: 40046
        value_type: S_DWORD
        read_lambda: |-
          if (id(delta_ctrl_mode).state == 1) { return 0; }
          return id(meter_TotWh_Imp).state;
