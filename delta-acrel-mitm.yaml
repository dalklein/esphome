  - platform: mqtt_subscribe
    id: delta_gt_meter_adjust
    name: "Delta Meter Adjustment"
    topic: "cmnd/delta-gt-meter/adjust_pwr"

  - platform: mqtt_subscribe
    id: raw_delta_ctrl_mode
    name: "RawDelta Control Mode"
    topic: "cmnd/delta-gt-meter/ctrl_mode"
# 0 - normal meter operation (inverter self-consumption), 1 - disable meter, charge battery from direct PV only

  - platform: mqtt_subscribe
    id: raw_delta_ctrl_gain
    name: "RawDelta Control Gain"
    topic: "cmnd/delta-gt-meter/ctrl_gain"
# 1 - normal gain

  - platform: template
    id: delta_ctrl_mode
    name: "Delta Control Mode"
    lambda: |-
      if (id(raw_delta_ctrl_mode).state == NAN) {
        return 0;  // Use 0 if delta_ctrl_mode is not published
      }
      return id(raw_delta_ctrl_mode).state;  // Return the state if valid

  - platform: template
    id: delta_ctrl_gain
    name: "Delta Control Gain"
    lambda: |-
      if (id(raw_delta_ctrl_gain).state == NAN) {
        return 1.0;  // Use 1 if delta_ctrl_gain is not published
      }
      return id(raw_delta_ctrl_gain).state;  // Return the state if valid

  - platform: template
    id: processed_delta_gt_meter_adjust
    name: "Processed Delta Meter Adjustment"
    lambda: |-
      if (id(delta_gt_meter_adjust).state == NAN) {
        return 0;  // Initialize to 0 if no value
      }
      return id(delta_gt_meter_adjust).state;  // Return the state if valid

  - platform: template
    id: processed_delta_gt_meter_adjust_half
    name: "Processed Delta Meter Adjustment Half"
    lambda: |-
      float adjustment = id(processed_delta_gt_meter_adjust).state;
      return adjustment == NAN ? 0 : adjustment / 2;  // Initialize to 0 if no value

  - platform: template
    id: filt_meter_total_real_power
    name: "Filtered Meter Total Real Power"
    lambda: |-
      float latest_trp = id(meter_total_real_power).state;  // Latest read value
      float new_state =  1.0 * latest_trp;  
      return static_cast<int16_t>(new_state);  // Return as signed 16-bit integer

  - platform: template
    id: adjusted_meter_power
    name: "Adjusted Meter Power"

  - platform: template
    id: adjusted_power_ph_a
    name: "Adjusted Power Phase A"

  - platform: template
    id: adjusted_power_ph_b
    name: "Adjusted Power Phase B"

